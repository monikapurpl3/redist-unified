[package]
name = "redist"
description = "Installs the Windows runtimes programs commonly ask for"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
redist-core = { path = "../redist-core" }

# The exe requires administrator rights (build.rs), so its own test build
# could not run unelevated. Its tested parts are in the library (src/lib.rs).
[[bin]]
name = "redist"
path = "src/main.rs"
test = false
